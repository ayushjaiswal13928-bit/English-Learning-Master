<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="110" fill="url(#grad)" />
  
  <!-- Subtle inner border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#60A5FA" stroke-width="4" stroke-opacity="0.3" />

  <!-- Open Book Symbol -->
  <path d="M96 352c48-24 96-24 160 0 64-24 112-24 160 0V160c-48-24-96-24-160 0-64-24-112-24-160 0v192z" fill="#FFFFFF" />
  <path d="M256 160v192" stroke="#2563EB" stroke-width="6" stroke-linecap="round" />

  <!-- Letters A B C -->
  <text x="176" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="900" fill="#2563EB" text-anchor="middle">A</text>
  <text x="256" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="900" fill="#F59E0B" text-anchor="middle">★</text>
  <text x="336" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="900" fill="#0284C7" text-anchor="middle">B</text>
  
  <!-- Shining Star at top -->
  <polygon points="256,70 274,124 330,124 284,158 302,212 256,178 210,212 228,158 182,124 238,124" fill="url(#gold)" />

  <!-- Hindi Subtitle ribbon banner -->
  <rect x="96" y="384" width="320" height="52" rx="26" fill="#F59E0B" />
  <text x="256" y="420" font-family="'Noto Sans Devanagari', 'Mukta', system-ui, sans-serif" font-size="24" font-weight="900" fill="#0F172A" text-anchor="middle">अंग्रेज़ी सीखें</text>
</svg>
